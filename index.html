<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Video Monitor Wall</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100%22><text y=%22.9em%22 font-size=%2290%22>🐹</text></svg>">
    <!-- 載入 mpegts.js 支援公部門 CCTV HTTP-FLV 裸串流直接硬解播放 -->
    <script src="https://cdn.jsdelivr.net/npm/mpegts.js@1.7.3/dist/mpegts.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #0f1115;
            color: #e0e0e0;
            font-family: "Segoe UI", Roboto, sans-serif;
            padding: 10px;
            overflow-y: auto;
        }
        header {
            display: flex;
            flex-wrap: wrap; /* 手機上自動折行 */
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
            padding-bottom: 10px;
            border-bottom: 2px solid #2a2e39;
        }
        h1 {
            font-size: 18px;
            letter-spacing: 1px;
            color: #00ffcc;
        }
        .status {
            font-size: 11px;
            color: #888;
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }
        .server-box {
            display: flex;
            align-items: center;
            gap: 6px;
            background: #181b22;
            padding: 3px 8px;
            border-radius: 4px;
            border: 1px solid #2a2e39;
        }
        .server-box code {
            color: #00ffcc;
            font-family: monospace;
            font-size: 11px;
        }
        .action-btn {
            background: #2a2e39;
            color: #fff;
            border: none;
            padding: 4px 8px;
            font-size: 11px;
            border-radius: 3px;
            cursor: pointer;
            transition: 0.2s;
        }
        .action-btn:hover {
            background: #00ffcc;
            color: #000;
        }
        
        /* 預設：電腦與桌上型大螢幕 (保持 3 欄) */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            width: 100%;
        }
        .grid-item {
            background: #181b22;
            border: 1px solid #2a2e39;
            border-radius: 6px;
            position: relative;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            height: 300px; /* 電腦版固定高度 */
        }

        /* 頂部控制與 URL 輸入列 */
        .control-bar {
            display: flex;
            align-items: center;
            gap: 4px;
            background: #21252d;
            padding: 6px;
            border-bottom: 1px solid #2a2e39;
            z-index: 10;
        }
        .tag {
            background: rgba(0, 0, 0, 0.75);
            color: #fff;
            padding: 3px 6px;
            font-size: 11px;
            border-radius: 3px;
            border-left: 3px solid #00ffcc;
            white-space: nowrap;
        }
        .url-input {
            flex: 1;
            min-width: 0; /* 避免 flex 子元素被文字撐破 */
            background: #0f1115;
            border: 1px solid #3a3f4d;
            color: #00ffcc;
            padding: 4px 6px;
            font-size: 11px;
            border-radius: 3px;
            outline: none;
        }
        .url-input:focus {
            border-color: #00ffcc;
        }
        .btn {
            background: #2a2e39;
            color: #fff;
            border: none;
            padding: 4px 8px;
            font-size: 11px;
            border-radius: 3px;
            cursor: pointer;
            transition: 0.2s;
            white-space: nowrap;
        }
        .btn:hover {
            background: #00ffcc;
            color: #000;
        }
        .btn-clear {
            background: #3a2a2e;
            color: #ff8888;
        }
        .btn-clear:hover {
            background: #ff4444;
            color: #fff;
        }

        /* 畫面區域 (同時支援 iframe 與原生 FLV video) */
        .iframe-wrapper {
            flex: 1;
            width: 100%;
            height: 100%;
            background: #000;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .iframe-wrapper iframe,
        .iframe-wrapper video {
            width: 100%;
            height: 100%;
            border: none;
            object-fit: contain;
            background: #000;
        }
        .flv-overlay-msg {
            position: absolute;
            color: #94a3b8;
            font-size: 11px;
            text-align: center;
            padding: 12px;
            line-height: 1.5;
            pointer-events: none;
            font-family: monospace;
        }

        /* 📱 響應式手機/窄螢幕視圖 (寬度小於 768px 時觸發) */
        @media (max-width: 768px) {
            .grid-container {
                grid-template-columns: 1fr; /* 改為單欄顯示 */
                gap: 15px;
            }
            .grid-item {
                height: auto; /* 高度隨畫面彈性伸縮 */
            }
            .iframe-wrapper {
                aspect-ratio: 16 / 9; /* 強制保持 16:9 影音標準比例 */
                height: auto;
            }
            h1 {
                font-size: 16px;
            }
            .tag {
                font-size: 10px;
                padding: 2px 4px;
            }
            .btn {
                padding: 4px 6px;
                font-size: 10px;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>HamsterTAK VIDEO MONITOR WALL</h1>
        <div class="status">
            <span>WEBRTC + FLV MODE</span>
            <div class="server-box">
                <span>HamsterTAK:</span>
                <code id="base-url-text">http://129.225.167.253:8889/</code>
                <button class="action-btn" id="copy-btn" onclick="copyBaseUrl()">📋 Copy</button>
            </div>
            <button class="action-btn" id="fullscreen-btn" onclick="toggleFullscreen()">⛶ Fullscreen</button>
        </div>
    </header>

    <div class="grid-container">
        <script>
            const DEFAULT_BASE = "http://129.225.167.253:8889/";
            
            // 動態生成 15 個監控視窗
            for (let i = 1; i <= 15; i++) {
                const padId = String(i).padStart(2, '0');
                document.write(`
                    <div class="grid-item">
                        <div class="control-bar">
                            <div class="tag">CAM ${padId}</div>
                            <input type="text" class="url-input" id="input-${i}" value="" placeholder="Path, Link, FLV, or udp://">
                            <button class="btn" onclick="updateStream(${i})">Load</button>
                            <button class="btn btn-clear" onclick="clearStream(${i})">Clear</button>
                        </div>
                        <div class="iframe-wrapper" id="wrapper-${i}">
                            <!-- 預設待機保持乾淨黑畫面 -->
                            <iframe src="about:blank" allow="autoplay; fullscreen"></iframe>
                        </div>
                    </div>
                `);
            }
        </script>
    </div>

    <script>
        // 儲存每一格的 mpegts.js 播放器實例，確保切換或清除時能徹底釋放記憶體與連線
        const flvPlayers = {};

        function destroyFlvPlayer(index) {
            if (flvPlayers[index]) {
                try {
                    flvPlayers[index].pause();
                    flvPlayers[index].unload();
                    flvPlayers[index].detachMediaElement();
                    flvPlayers[index].destroy();
                } catch (e) {}
                delete flvPlayers[index];
            }
        }

        // 一鍵複製 Base URL
        function copyBaseUrl() {
            const baseUrl = "http://129.225.167.253:8889/";
            navigator.clipboard.writeText(baseUrl).then(() => {
                const btn = document.getElementById("copy-btn");
                btn.innerText = "✓ Copied!";
                btn.style.background = "#00ffcc";
                btn.style.color = "#000";
                setTimeout(() => {
                    btn.innerText = "📋 Copy";
                    btn.style.background = "#2a2e39";
                    btn.style.color = "#fff";
                }, 1500);
            });
        }

        // 全螢幕切換按鈕
        function toggleFullscreen() {
            const btn = document.getElementById("fullscreen-btn");
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().then(() => {
                    btn.innerText = "❌ Exit Fullscreen";
                }).catch(err => {
                    alert(`無法切換至全螢幕模式: ${err.message}`);
                });
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen().then(() => {
                        btn.innerText = "⛶ Fullscreen";
                    });
                }
            }
        }

        // 監聽 Esc 或系統關閉全螢幕事件，同步更新按鈕文字
        document.addEventListener("fullscreenchange", () => {
            const btn = document.getElementById("fullscreen-btn");
            if (!document.fullscreenElement) {
                btn.innerText = "⛶ Fullscreen";
            } else {
                btn.innerText = "❌ Exit Fullscreen";
            }
        });

        // 載入串流邏輯 (自動判斷 WebRTC iframe 或 HTTP-FLV 原生硬解)
        function updateStream(index) {
            const input = document.getElementById(`input-${index}`);
            const wrapper = document.getElementById(`wrapper-${index}`);
            let val = input.value.trim();

            // 1. 先徹底銷毀該格可能存在的舊 FLV 播放器實例並清空 DOM
            destroyFlvPlayer(index);
            wrapper.innerHTML = '';

            if (!val) {
                wrapper.innerHTML = `<iframe src="about:blank" allow="autoplay; fullscreen"></iframe>`;
                return;
            }

            let targetUrl = "";
            if (/^https?:\/\//i.test(val)) {
                // 自動將開頭大寫的 Https:// 正規化為標準 https://
                targetUrl = val.replace(/^https?:\/\//i, m => m.toLowerCase());
            } else if (/^(udp|rtsp|rtmp):\/\//i.test(val)) {
                // 自動轉碼帶入 MediaMTX all_others 動態代理
                const encodedSource = encodeURIComponent(val);
                targetUrl = DEFAULT_BASE + encodedSource;
            } else {
                // 輸入簡易 Path (如 neoyangminidrone) 時自動拼上根目錄
                const cleanPath = val.replace(/^\/+/, '');
                targetUrl = DEFAULT_BASE + cleanPath;
            }

            // 判斷是否為公部門 CCTV 常見的 HTTP-FLV 裸串流 (含 /flv/ 或 .flv)
            const isFlvStream = /\/flv\/|\.flv($|\?)/i.test(targetUrl);

            setTimeout(() => {
                if (isFlvStream) {
                    // 使用 mpegts.js 直接在該監控格內硬解播放 FLV，防止觸發瀏覽器檔案下載！
                    wrapper.innerHTML = `
                        <video id="video-${index}" autoplay muted controls playsinline></video>
                        <div class="flv-overlay-msg" id="msg-${index}">⏳ Decoding FLV...</div>
                    `;
                    const videoEl = document.getElementById(`video-${index}`);
                    const msgEl = document.getElementById(`msg-${index}`);

                    if (window.mpegts && mpegts.isSupported()) {
                        const player = mpegts.createPlayer(
                            { type: 'flv', isLive: true, hasAudio: false, url: targetUrl },
                            { enableWorker: true, enableStashBuffer: false, stashInitialSize: 128 }
                        );
                        flvPlayers[index] = player;
                        player.attachMediaElement(videoEl);
                        player.load();
                        player.play().then(() => {
                            if (msgEl) msgEl.style.display = 'none';
                        }).catch(() => {
                            if (msgEl) msgEl.innerText = '▶️ 請點擊畫面開始播放';
                        });
                        videoEl.addEventListener('playing', () => {
                            if (msgEl) msgEl.style.display = 'none';
                        });
                        player.on(mpegts.Events.ERROR, (errType) => {
                            if (msgEl) {
                                msgEl.style.display = 'block';
                                msgEl.innerHTML = `⚠️ FLV 串流離線或遭 CORS 阻擋 (${errType})`;
                            }
                        });
                    } else if (msgEl) {
                        msgEl.innerText = '❌ 瀏覽器不支援 MSE/FLV 解碼';
                    }
                } else {
                    // 一般 WebRTC 或網頁連結維持 iframe 載入
                    wrapper.innerHTML = `<iframe src="${targetUrl}" allow="autoplay; fullscreen"></iframe>`;
                }
            }, 100);
        }

        // 一鍵清除輸入內容並重置畫面
        function clearStream(index) {
            const input = document.getElementById(`input-${index}`);
            input.value = ""; // 清空輸入框
            updateStream(index); // 銷毀播放器並重置回預設待機黑畫面
        }

        // 支援按 Enter 鍵直接切換畫面
        document.querySelectorAll('.url-input').forEach((inputEl, idx) => {
            inputEl.addEventListener('keypress', function (e) {
                if (e.key === 'Enter') {
                    updateStream(idx + 1);
                }
            });
        });
    </script>

</body>
</html>
